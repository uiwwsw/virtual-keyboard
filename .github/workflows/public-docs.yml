name: Commit hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check added public content and credentials
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "${REVIEW_BASE}^{commit}" 2>/dev/null; then
            REVIEW_BASE=0000000000000000000000000000000000000000
          fi
          python3 .github/scripts/check-public-docs.py --base "$REVIEW_BASE" --head "$REVIEW_HEAD"
