name: Publish to NPM

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate source and package
        run: npm run check

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Verify browser behavior
        run: npm run test:e2e

      - name: Check whether version is already published
        id: version_check
        run: node scripts/check-published.mjs

      - name: Publish to NPM
        if: steps.version_check.outputs.published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
